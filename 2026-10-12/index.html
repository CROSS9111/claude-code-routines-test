<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI &amp; 世界情勢ニュースまとめ — 2026年10月12日</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      font-size: 15px;
      line-height: 1.75;
    }
    a { color: #0366d6; text-decoration: none; }
    a:visited { color: #0366d6; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid #e5e7eb; padding: 2rem 1.5rem 1.5rem; text-align: center; }
    header h1 { font-size: 1.65rem; font-weight: 700; color: #1f2328; margin-bottom: 0.3rem; }
    header h1 span { border-bottom: 3px solid #0366d6; padding-bottom: 2px; }
    header .subtitle { color: #656d76; font-size: 0.88rem; margin-bottom: 0.5rem; }
    header .date { font-size: 0.83rem; color: #656d76; }
    nav { border-bottom: 1px solid #e5e7eb; padding: 0.5rem 1.5rem; display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: center; }
    nav a { color: #656d76; font-size: 0.83rem; padding: 0.3rem 0.7rem; border-radius: 6px; border: 1px solid transparent; }
    nav a:hover { color: #0366d6; border-color: #e5e7eb; text-decoration: none; }
    .container { max-width: 1060px; margin: 0 auto; padding: 2rem 1.5rem; }
    .section { margin-bottom: 3rem; }
    .section-header { display: flex; align-items: baseline; gap: 0.7rem; padding-bottom: 0.6rem; margin-bottom: 1.2rem; border-bottom: 2px solid #e5e7eb; }
    .section-title { font-size: 1.05rem; font-weight: 700; color: #1f2328; }
    .section-title::before { content: ''; display: inline-block; width: 4px; height: 1em; background: #0366d6; border-radius: 2px; margin-right: 0.5rem; vertical-align: middle; }
    .section-count { font-size: 0.78rem; color: #656d76; margin-left: auto; }
    .alert { border: 1px solid #e5e7eb; border-left: 4px solid #0366d6; border-radius: 4px; padding: 0.9rem 1.1rem; margin-bottom: 1.2rem; font-size: 0.88rem; color: #1f2328; line-height: 1.65; }
    .card { border: 1px solid #e5e7eb; border-radius: 6px; padding: 1.1rem 1.3rem; margin-bottom: 0.85rem; }
    .card:last-child { margin-bottom: 0; }
    .card-title { font-size: 0.97rem; font-weight: 600; color: #1f2328; margin-bottom: 0.45rem; line-height: 1.45; }
    .card-meta { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
    .badge { font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 3px; border: 1px solid #e5e7eb; color: #656d76; background: #ffffff; letter-spacing: 0.03em; text-transform: uppercase; }
    .card-source { font-size: 0.78rem; color: #656d76; }
    .card-body { font-size: 0.875rem; color: #1f2328; line-height: 1.7; }
    .card-body p { margin-bottom: 0.45rem; }
    .card-body p:last-child { margin-bottom: 0; }
    .card-body ul { padding-left: 1.3rem; }
    .card-body ul li { margin-bottom: 0.25rem; }
    footer { border-top: 1px solid #e5e7eb; padding: 1.4rem 1.5rem; text-align: center; font-size: 0.8rem; color: #656d76; }
    footer a { color: #656d76; }
    footer a:visited { color: #656d76; }
    @media (max-width: 600px) { header h1 { font-size: 1.3rem; } .container { padding: 1.2rem 1rem; } }
  </style>
</head>
